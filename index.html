function tick(){S.day++;let r=0,c=0,w=0;S.biz.forEach(b=>{const x=B[b.t],u=x[7]+b.up*5;r+=u*x[6]*(.85+R()*.3)*S.mod.d*(1+(S.sat-70)/400);c+=u*x[3]*S.mod.c+x[4]*x[5];w+=x[4];const p=PL[b.p];coinFx(p.x,p.z)});

PL.forEach((p,i)=>{const m=new T.Mesh(new T.BoxGeometry(3,.2,3),new T.MeshStandardMaterial({color:0x34d399,transparent:true,opacity:.7}));m.position.set(p.x,.15,p.z);m.userData.pl=i;scene.add(m);plotM[i]=m});
for(let i=0;i<40;i++){const x=(R()-.5)*80,z=(R()<.5?-1:1)*(15+R()*12);const t=new T.Mesh(new T.ConeGeometry(.9,2.4,8),new T.MeshStandardMaterial({color:0x2e9e4f}));t.position.set(x,1.6,z);t.castShadow=true;scene.add(t);box(.3,.5,.3,0x7a4b1e,x,.25,z,false)}
for(let i=0;i<7;i++){const cr=new T.Group(),c=[0xe74c3c,0xf1c40f,0x3498db,0xffffff,0x9b59b6,0x2ecc71,0xff7f50][i];const b=new T.Mesh(new T.BoxGeometry(2,.7,1),new T.MeshStandardMaterial({color:c}));b.position.y=.5;b.castShadow=true;const t=new T.Mesh(new T.BoxGeometry(1,.5,.9),new T.MeshStandardMaterial({color:0xcfe8ff}));t.position.set(-.1,1,0);cr.add(b,t);cr.position.set(-35+i*10,0,i%2?.8:-.8);cr.userData.v=(i%2?1:-1)*(5+R()*3);cr.rotation.y=i%2?0:Math.PI;scene.add(cr);cars.push(cr)}

Z.forEach((z,i)=>{const w=chibi([0x555555,0x2f5bd8,0x222222,0xe67e22,0xffffff,0xff9800,0x558b2f][i],0x3a2a1a,1);w.position.set(z[1]+4.2,0,z[2]<0?-2.8:2.8);w.rotation.y=z[2]<0?0:Math.PI;scene.add(w);walkers.push(w)});

function mk3(b){if(!T)return;const x=B[b.t],p=PL[b.p],g=new T.Group();g.position.set(p.x,0,p.z);g.userData.t=0;const h=2.2+b.t*.5,mat=c=>new T.MeshStandardMaterial({color:c,roughness:.6}),bd=new T.Mesh(new T.BoxGeometry(2.4,h,2.4),mat(x[8]));bd.position.y=h/2;bd.castShadow=true;bd.userData.pl=b.p;const rf=new T.Mesh(new T.BoxGeometry(2.6,.3,2.6),mat(0xffffff));rf.position.y=h+.15;g.add(bd,rf);if(b.t==0){const ch=new T.Mesh(new T.CylinderGeometry(.3,.3,1.6,8),mat(0x666666));ch.position.set(.7,h+1,.7);g.add(ch)}

function ray(e){mouse.set(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1);raycaster.setFromCamera(mouse,camera);const objs=[];plotM.forEach(m=>m.visible&&objs.push(m));Object.values(bl).forEach(g=>objs.push(g.children[0]));const h=raycaster.intersectObjects(objs)[0];return h?h.object:null}

function animate(){requestAnimationFrame(animate);const dt=Math.min(clock.getDelta(),.05),t=clock.elapsedTime;
if(mode=='intro'){gth+=dt*.12;grad=Math.max(48,grad-dt*2);gph=.9}if(mode=='setup'){gtg.set(-1.2,1.3,3);gph=1.35;grad=7}else if(mode!='setup')gtg.set(0,0,0);
th+=(gth-th)*.06;ph+=(gph-ph)*.06;rad+=(grad-rad)*.06;tg.lerp(gtg,.06);camera.position.set(tg.x+rad*Math.sin(ph)*Math.sin(th),tg.y+rad*Math.cos(ph),tg.z+rad*Math.sin(ph)*Math.cos(th));camera.lookAt(tg);

Object.values(bl).forEach(g=>{if(g.scale.y<1)g.scale.y=Math.min(1,g.scale.y+dt*1.5)});
